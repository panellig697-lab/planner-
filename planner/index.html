  const mon = new Date(now); mon.setDate(now.getDate() + diff);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const f = d => d.toLocaleDateString("en-GB", { day:"numeric", month:"short" });
  return f(mon) + " – " + f(sun);
}
function getMondayOfWeek(off = 0) {
  const now = new Date();

  const m = new Date(now); m.setDate(now.getDate() + diff);
  return m;

  const days = {};

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;

    if (p.week && !p.weeks) {
      return { weeks:{ current:p.week, next:blankWeek(getWeekLabel(1)) }, history:p.history||[], routines:p.routines||[] };
    }
    if (p.weeks && !p.weeks.next) p.weeks.next = blankWeek(getWeekLabel(1));

  function renderDayNav() {

      DAYS.map((d, i) => {
        const active  = day === d;
        const isToday = i === todayIdx && !isNextWeek;
        const pct     = dayProgress(d);
        const hasOD   = !isNextWeek && i < todayIdx && (week.days[d] && week.days[d].tasks || []).some(t => !t.done);
        let cls = 'day-btn';
        if (active) cls += ' active';
        else if (isToday) cls += ' today';
        return h('button', { key:d, className:cls, onClick:()=>setDay(d) },
          h('span', { className:'day-lbl' }, SHORT[i]),
          h('span', { className:'day-num' }, getDayDate(i)),
          h('div',  { className:'dot-row' },
            pct !== null
              ? h('div', { className:'dot ' + (pct===100?'done':pct>0?'partial':'') })
              : h('div', { style:{width:4,height:4} }),
            hasOD ? h('div', { className:'dot overdue' }) : null
          )
        );
      })
    );
  }
  function renderProgress() {
    let label = day;
    if (!isNextWeek && dayIdx === todayIdx) label += " · Today";
    else if (!isNextWeek && dayIdx < todayIdx) label += " · Past";
    else if (isNextWeek) label += " · Next week";
    else label += " · Upcoming";
    const rightLabel = prog === null ? "Nothing planned" : prog === 100 ? "✓ All done" : prog + "% complete";
    const rightColor = prog === 100 ? "#22c55e" : "#7a7890";
    return h('div', { className:'prog-wrap' },
      h('div', { className:'prog-meta' },
        h('span', null, label),
        h('span', { style:{color:rightColor} }, rightLabel)
      ),
      h('div', { className:'prog-bar' },
        h('div', { className:'prog-fill', style:{width:(prog||0)+"%"} })
      )
    );
  }
  function renderRoutinesForDay() {
    const dr = dayRoutines(day);
    if (!dr.length) return null;
    const grouped = [];
    CATS.forEach(cat => {
      const items = dr.filter(r => (r.category||"Other") === cat);
      if (items.length) grouped.push({ cat, items });
    });
    return h('div', { className:'section' },
      h('div', { className:'section-label' }, "Daily Routine"),
      h('div', { className:'card' },
        grouped.map(({ cat, items }) =>
          h(Fragment, { key:cat },
            grouped.length > 1
              ? h('div', { className:'cat-header' },
                  h(CatDot, { cat }),
                  h('span', { className:'cat-label', style:{color:CAT_COLOR[cat]||'#7c6fff'} }, cat)
                )
              : null,
            items.map(r => {
              const s = rStatus(r.id);
              const done = s === "done", skipped = s === "skip";
              const skipReason = typeof (week.days[day] && week.days[day].routineOverrides && week.days[day].routineOverrides[r.id]) === "string"
                && week.days[day].routineOverrides[r.id];
              let checkCls = 'check';
              if (done) checkCls += ' checked';
              else if (skipped) checkCls += ' skipped';
              return h('div', { key:r.id, className:'card-row' + (done||skipped?' done':'') },
                h('div', { className:checkCls, onClick:()=>cycleRoutine(r.id) },
                  done ? "✓" : skipped ? "–" : null
                ),
                h('span', { className:'item-text' + (done||skipped?' done':'') }, r.text),
                r.time && !skipped ? h('span', { className:'badge badge-purple' }, r.time) : null,
                skipped && skipReason ? h('span', { className:'badge badge-red' }, skipReason) : null
              );
            })
          )
        )
      ),
      h('div', { style:{fontSize:11,color:'#3f3d52',marginTop:5,paddingLeft:2} },
        "Tap to complete · again to skip · again to reset"
      )
    );
  }
  function renderTasks() {
    return h('div', { className:'section' },
      h('div', { className:'section-label' }, "Tasks for " + day),
      h('div', { className:'card' },
        dayD.tasks.length === 0
          ? h('div', { className:'empty-state' }, "No tasks yet — add one below")
          : dayD.tasks.map((task, i) => {
              const isHigh = task.priority === "high";
              return h('div', {
                key:task.id,
                className:'card-row' + (task.done?' done':''),
                draggable: !task.done,
                onDragStart: e => onDragStart(e, i),
                onDragOver: onDragOver,
                onDrop: e => onDrop(e, i)
              },
                !task.done ? h('span', { className:'drag-handle' }, "⠿") : null,
                h('div', {
                  className:'check' + (task.done?' checked':''),
                  onClick:()=>toggleTask(task.id)
                }, task.done ? "✓" : null),
                editTaskId === task.id
                  ? h('input', {
                      className:'txt-input', autoFocus:true, value:editTaskVal,
                      onChange:e=>setEditTaskVal(e.target.value),
                      onBlur:()=>saveTaskEdit(task.id),
                      onKeyDown:e=>{ if(e.key==="Enter")saveTaskEdit(task.id); if(e.key==="Escape"){setEditTaskId(null);setEditTaskVal("");} },
                      style:{padding:"3px 9px",height:30}
                    })
                  : h('span', {
                      className:'item-text' + (task.done?' done':''),
                      style:{cursor:'text'},
                      onDoubleClick:()=>{ if(!task.done){ setEditTaskId(task.id); setEditTaskVal(task.text); } }
                    }, task.text),
                isHigh && !task.done ? h('span', { className:'badge-high' }, "HIGH") : null,
                h('div', { className:'copy-wrap' },
                  h('button', {
                    className:'del-btn',
                    style:{fontSize:15},
                    title:'Copy to another day',
                    onClick:e=>{ e.stopPropagation(); setCopyMenuId(copyMenuId===task.id?null:task.id); }
                  }, "⇢"),
                  copyMenuId === task.id
                    ? h('div', { className:'copy-menu', onClick:e=>e.stopPropagation() },
                        h('div', { className:'copy-menu-label' }, isNextWeek?"Copy to (next week)":"Copy to this week"),
                        DAYS.filter(d => d !== day || isNextWeek).map(d =>
                          h('button', { key:d, className:'copy-menu-item', onClick:()=>copyTask(task, d) }, d)
                        ),
                        !isNextWeek ? h(Fragment, null,
                          h('div', { className:'copy-divider' }),
                          h('div', { className:'copy-menu-label' }, "Next week"),
                          DAYS.map(d =>
                            h('button', { key:"nw"+d, className:'copy-menu-item next', onClick:()=>copyTask(task, d, "next") }, d)
                          )
                        ) : null
                      )
                    : null
                ),
                h('button', { className:'del-btn', onClick:()=>deleteTask(task.id) }, "×")
              );
            })
      ),
      h('div', { className:'add-row' },
        h('button', {
          className:'pri-btn' + (newPri==="high"?' high':''),
          onClick:()=>setNewPri(p=>p==="high"?"normal":"high"),
          title:'Toggle priority'
        }, "⚑"),
        h('input', {
          className:'txt-input', placeholder:'Add a task…', value:newTask,
          onChange:e=>setNewTask(e.target.value),
          onKeyDown:e=>e.key==="Enter"&&addTask()
        }),
        h('button', { className:'add-btn', onClick:addTask }, "+")
      ),
      newPri==="high" ? h('div', { style:{fontSize:11,color:'#f59e0b',marginTop:5,paddingLeft:2} }, "High priority") : null
    );
  }
  function renderWeekTab() {
    return h(Fragment, null,
      isNextWeek
        ? h('div', { className:'next-week-banner' },
            h('span', { style:{fontSize:18} }, "📅"),
            h('div', null,
              h('div', { style:{fontSize:12,fontWeight:600,color:'#7c6fff'} }, "Planning ahead"),
              h('div', { style:{fontSize:11,color:'#7a7890',marginTop:1} }, "Tasks added here will be waiting for you next week")
            )
          )
        : null,
      !isNextWeek && overdueTasks.length > 0 && dayIdx === todayIdx
        ? h('div', { className:'overdue-banner' },
            h('div', { className:'overdue-hdr' }, "⚠ Overdue from earlier this week"),
            overdueTasks.map(t =>
              h('div', { key:t.id, className:'overdue-row' },
                h('span', { className:'badge badge-red', style:{flexShrink:0} }, t.fromDay.slice(0,3)),
                h('span', { style:{flex:1,fontSize:13,color:'#7a7890'} }, t.text),
                h('div', { className:'copy-wrap' },
                  h('button', {
                    className:'ghost-btn', style:{fontSize:11,padding:'4px 8px'},
                    onClick:e=>{ e.stopPropagation(); setCopyMenuId(copyMenuId===t.id+"_od"?null:t.id+"_od"); }
                  }, "Move to →"),
                  copyMenuId === t.id+"_od"
                    ? h('div', { className:'copy-menu', onClick:e=>e.stopPropagation() },
                        DAYS.filter(d=>d!==t.fromDay).map(d=>
                          h('button', { key:d, className:'copy-menu-item', onClick:()=>{ copyTask(t,d); setCopyMenuId(null); } }, d)
                        )
                      )
                    : null
                )
              )
            )
          )
        : null,
      renderProgress(),
      skipMenuId
        ? h('div', { className:'skip-box', onClick:e=>e.stopPropagation() },
            h('div', { style:{fontSize:12,color:'#7a7890'} }, "Why are you skipping this?"),
            h('div', { className:'skip-grid' },
              SKIP_REASONS.map(r =>
                h('button', { key:r, className:'skip-pill', onClick:()=>applySkip(skipMenuId,r) }, r)
              )
            )
          )
        : null,
      renderRoutinesForDay(),
      renderTasks(),
      h('div', { className:'section' },
        h('div', { className:'section-label' }, "Notes for " + day),
        h('textarea', {
          className:'note-area',
          placeholder:'Ideas, context, anything worth remembering…',
          value: dayD.notes || "",
          onChange: e => updateNotes(e.target.value)
        })
      )
    );
  }
  function renderRoutinesTab() {
    return h('div', { className:'section' },
      h('div', { style:{marginBottom:16} },
        h('div', { className:'section-label' }, "Your Routines"),
        h('div', { style:{fontSize:12,color:'#3f3d52'} }, "Set which days each routine appears. Streaks count consecutive completions — skips don't break them.")
      ),
      routines.length === 0
        ? h('div', { className:'card', style:{marginBottom:16} }, h('div', { className:'empty-state' }, "No routines yet"))
        : null,
      CATS.map(cat => {
        const group = routines.filter(r => (r.category||"Other") === cat);
        if (!group.length) return null;
        return h('div', { key:cat, style:{marginBottom:16} },
          h('div', { style:{display:'flex',alignItems:'center',gap:7,marginBottom:8} },
            h(CatDot, { cat }),
            h('span', { className:'cat-label', style:{color:CAT_COLOR[cat]||'#7c6fff'} }, cat)
          ),
          h('div', { className:'card' },
            group.map((r, i) => {
              const streak = getStreak(r.id);
              return h('div', { key:r.id, className:'routine-block' },
                h('div', { className:'routine-top' },
                  h(CatDot, { cat }),
                  editRoutineId === r.id
                    ? h('input', {
                        className:'txt-input', autoFocus:true, value:editRoutineVal,
                        style:{flex:1,padding:"3px 10px",height:30},
                        onChange:e=>setEditRoutineVal(e.target.value),
                        onBlur:()=>saveRoutineEdit(r.id),
                        onKeyDown:e=>{ if(e.key==="Enter")saveRoutineEdit(r.id); if(e.key==="Escape"){setEditRoutineId(null);setEditRoutineVal("");} }
                      })
                    : h('span', {
                        style:{flex:1,fontSize:14,color:'#e4e2f0',cursor:'text'},
                        onDoubleClick:()=>{ setEditRoutineId(r.id); setEditRoutineVal(r.text); }
                      }, r.text),
                  r.time ? h('span', { className:'badge badge-purple' }, r.time) : null,
                  streak >= 2 ? h('span', { className:'streak-badge' }, "🔥 " + streak + "d") : null,
                  h('select', {
                    value: r.category||"Other",
                    className:'sm-input',
                    style:{width:90,fontSize:11},
                    onChange:e=>updateRoutineField(r.id,"category",e.target.value)
                  }, CATS.map(c => h('option', { key:c, value:c }, c))),
                  h('button', { className:'del-btn', onClick:()=>deleteRoutine(r.id) }, "×")
                ),
                h('div', { className:'day-pills' },
                  DAYS.map(d =>
                    h('button', {
                      key:d,
                      className:'day-pill',
                      style: r.days && r.days.includes(d)
                        ? { background:(CAT_COLOR[cat]||'#7c6fff')+'22', color:CAT_COLOR[cat]||'#7c6fff', borderColor:(CAT_COLOR[cat]||'#7c6fff')+'55' }
                        : {},
                      onClick:()=>toggleRoutineDay(r.id, d)
                    }, d.slice(0,3))
                  )
                ),
                streak === 1 ? h('div', { style:{fontSize:11,color:'#3f3d52',marginTop:6} }, "Complete again tomorrow to start a streak") : null
              );
            })
          )
        );
      }),
      h('div', { className:'add-routine-box' },
        h('div', { className:'section-label', style:{marginBottom:10} }, "Add Routine"),
        h('div', { className:'add-routine-inner' },
          h('input', {
            className:'txt-input', placeholder:'e.g. Morning run, Review emails', value:newR,
            onChange:e=>setNewR(e.target.value),
            onKeyDown:e=>e.key==="Enter"&&addRoutine()
          }),
          h('div', { className:'add-routine-row' },
            h('input', { className:'sm-input', type:'time', value:newRTime, style:{width:100}, onChange:e=>setNewRTime(e.target.value) }),
            h('select', { className:'sel-input', value:newRCat, style:{flex:1}, onChange:e=>setNewRCat(e.target.value) },
              CATS.map(c => h('option', { key:c, value:c }, c))
            ),
            h('button', { className:'add-btn', style:{width:'auto',padding:'0 16px',fontSize:15,fontWeight:600}, onClick:addRoutine }, "Add")
          )
        )
      )
    );
  }
  function renderHistoryTab() {
    const history = data.history || [];
    if (history.length === 0) {
      return h('div', { className:'section' },
        h('div', { className:'card' }, h('div', { className:'empty-state' }, "No history yet — reset a week to archive it here"))
      );
    }
    const hw = history[histIdx];
    const totalT = DAYS.reduce((a,d) => a + ((hw.days[d] && hw.days[d].tasks && hw.days[d].tasks.length)||0), 0);
    const doneT  = DAYS.reduce((a,d) => a + ((hw.days[d] && hw.days[d].tasks && hw.days[d].tasks.filter(t=>t.done).length)||0), 0);
    return h('div', { className:'section' },
      h('div', { className:'hist-nav' },
        h('div', { className:'section-label' }, "Week History"),
        h('div', { className:'hist-nav-btns' },
          h('button', { className:'ghost-btn', style:{opacity:histIdx<=0?0.3:1}, disabled:histIdx<=0, onClick:()=>setHistIdx(i=>Math.max(i-1,0)) }, "◀ Newer"),
          h('button', { className:'ghost-btn', style:{opacity:histIdx>=history.length-1?0.3:1}, disabled:histIdx>=history.length-1, onClick:()=>setHistIdx(i=>Math.min(i+1,history.length-1)) }, "Older ▶")
        )
      ),
      h('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12} },
        h('span', { style:{fontSize:13,color:'#7c6fff',fontWeight:600} }, hw.label),
        h('span', { className:'badge ' + (doneT===totalT&&totalT>0?'badge-green':'badge-purple') }, doneT+"/"+totalT+" tasks")
      ),
      DAYS.map(d => {
        const dd = hw.days[d];
        if (!dd || (!dd.tasks.length && !dd.notes)) return null;
        return h('div', { key:d, style:{marginBottom:14} },
          h('div', { style:{fontSize:10,fontWeight:700,color:'#3f3d52',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:7} }, d),
          h('div', { className:'card' },
            dd.tasks.map((t,i) =>
              h('div', { key:t.id, className:'card-row', style:{borderBottom:i<dd.tasks.length-1?'1px solid #252330':'none'} },
                h('div', { style:{width:14,height:14,borderRadius:4,background:t.done?'#7c6fff':'#252330',flexShrink:0} }),
                h('span', { className:'item-text'+(t.done?' done':''), style:{fontSize:13} }, t.text),
                t.priority==="high" ? h('span', { className:'badge-high' }, "HIGH") : null
              )
            ),
            dd.notes
              ? h('div', { style:{padding:'10px 13px',borderTop:'1px solid #252330',fontSize:12,color:'#7a7890',fontStyle:'italic',lineHeight:1.5} }, dd.notes)
              : null
          )
        );
      })
    );
  }
  return h('div', { className:'app', onClick:closeMenus },
    h('div', { className:'header' },
      h('div', { className:'top-row' },
        h('div', null,
          h('div', { className:'app-name' }, "Weekly Planner"),
          h('div', { className:'week-lbl' }, week.label)
        ),
        h('div', { className:'hdr-btns' },
          h('div', { className:'week-toggle-wrap' },
            h('button', {
              className:'week-toggle-btn' + (activeWeek==="current"?' active':''),
              onClick:()=>{ setActiveWeek("current"); setDay(DAYS[getTodayIdx()]); }
            }, "This Week"),
            h('button', {
              className:'week-toggle-btn' + (activeWeek==="next"?' active':''),
              onClick:()=>{ setActiveWeek("next"); setDay(DAYS[0]); }
            }, "Next Week")
          ),
          h('button', { className:'ghost-btn danger', onClick:()=>setShowReset(true) }, "Reset")
        )
      ),
      h('div', { className:'tabs' },
        h('button', { className:'tab-btn'+(tab==="week"?' active':''),     onClick:()=>setTab("week") }, "Days"),
        h('button', { className:'tab-btn'+(tab==="routines"?' active':''), onClick:()=>setTab("routines") }, "Routines"),
        h('button', { className:'tab-btn'+(tab==="history"?' active':''),  onClick:()=>setTab("history") }, "History")
      )
    ),
    tab === "week" ? renderDayNav() : null,
    h('div', { className:'content' },
      tab === "week"     ? renderWeekTab()     : null,
      tab === "routines" ? renderRoutinesTab() : null,
      tab === "history"  ? renderHistoryTab()  : null
    ),
    showReset
      ? h('div', { className:'modal-overlay', onClick:()=>setShowReset(false) },
          h('div', { className:'modal-box', onClick:e=>e.stopPropagation() },
            h('div', { className:'modal-title' }, "Archive & reset this week?"),
            h('div', { className:'modal-sub' }, "This week is saved to History. Any tasks planned for next week become this week. Routines carry forward untouched."),
            h('div', { className:'modal-btns' },
              h('button', { className:'cancel-btn', onClick:()=>setShowReset(false) }, "Cancel"),
              h('button', { className:'danger-btn', onClick:resetWeek }, "Archive & Reset")
            )
          )
        )
      : null
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Planner));
</script>
